name: Kripto Panosu (bulut)
on:
  schedule:
    - cron: '0 * * * *'      # her saat basi (UTC) — kripto 7/24 bulutta
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: panel-update
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Kripto paneli uret (bulut)
        shell: powershell
        run: .\kripto-panel.ps1 -Cloud -NoOpen
      - name: Yayinla
        shell: powershell
        run: |
          git config user.name "panel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kripto.html kripto-fiyat.json
          $c = git status --porcelain
          if ($c) {
            git commit -m ("kripto " + (Get-Date -Format 'yyyy-MM-dd HH:mm'))
            git pull --rebase origin main
            git push
            Write-Host "yayinlandi"
          } else {
            Write-Host "degisiklik yok"
          }
